name: CI - Calidad, Contratos y Seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar pruebas unitarias, integración, contratos y arquitectura
        run: npm test

      - name: Probar inicialización de semilla sintética y backup cifrado
        run: |
          npm run seed
          npm run backup
