services:
  gestion-papa:
    build: .
    container_name: gestion-trabajo-papa
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - HOST=0.0.0.0
      - PORT=3000
      - DB_PATH=/app/data/gestion_papa.sqlite
      - BACKUP_DIR=/app/backups
      - APP_SECRET=${APP_SECRET:-cambiar-esta-clave-en-produccion-32-chars}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
